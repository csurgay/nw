<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Networking for Kids</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/boot.js" defer></script>
    <script src="js/id.js" defer></script>
    <script src="js/terminal.js" defer></script>
    <script src="js/shell.js" defer></script>
    <script src="js/test.js" defer></script>
    <script src="js/init.js" defer></script>
    <script src="js/util.js" defer></script>
    <script src="js/lookup.js" defer></script>
    <script src="js/drawable.js" defer></script>
    <script src="js/clickable.js" defer></script>
    <script src="js/draggable.js" defer></script>
    <script src="js/mouse.js" defer></script>
    <script src="js/debug.js" defer></script>
    <script src="js/sim.js" defer></script>
    <script src="js/gfx.js" defer></script>
    <script src="js/wire.js" defer></script>
    <script src="js/inspector.js" defer></script>
    <script src="js/lldp.js" defer></script>
    <script src="js/mac.js" defer></script>
    <script src="js/layer2.js" defer></script>
    <script src="js/arp.js" defer></script>
    <script src="js/icmp.js" defer></script>
    <script src="js/routing.js" defer></script>
    <script src="js/frame.js" defer></script>
    <script src="js/pdu.js" defer></script>
    <script src="js/ip.js" defer></script>
    <script src="js/port.js" defer></script>
    <script src="js/nic.js" defer></script>
    <script src="js/layer3.js" defer></script>
    <script src="js/host.js" defer></script>
    <script src="js/patch.js" defer></script>
    <script src="js/hub.js" defer></script>
    <script src="js/viewport.js" defer></script>
    <script src="js/event.js" defer></script>
    <script src="js/main.js" defer></script>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark"></span>
            <span class="brand-name">nw</span>
            <span class="brand-sub">Network Lab · Layers 1–3</span>
        </div>
        <div class="controls">
            <button id="btnPlay" class="ctl" title="Play / pause the simulation (Space)">
                <span class="ico" id="icoPlay"></span><span id="lblPlay">Pause</span>
            </button>
            <button id="btnStep" class="ctl" title="Run until the next network event, then pause (N)">
                <span class="ico ico-step"></span>Step
            </button>
            <label class="speed" title="Simulation speed">
                <span>Speed</span>
                <input id="speed" type="range" min="0" max="5" step="1" value="2">
                <output id="speedOut">1×</output>
            </label>
            <div class="clock"><span id="simState" class="state run">running</span><span id="simTime">t = 0.0 s</span></div>
        </div>
        <div class="legend">
            <span class="chip" style="--c:var(--arp)">ARP</span>
            <span class="chip" style="--c:var(--icmp)">ICMP</span>
            <span class="chip" style="--c:var(--lldp)">LLDP</span>
            <span class="chip" style="--c:var(--eth)">Ethernet</span>
        </div>
    </header>

    <main class="layout">
        <section class="stage" id="stage">
            <canvas id="nwCanvas" width="1000" height="600"></canvas>
            <div class="stage-hint">Hover for a quick look · click any device, cable or frame to inspect it</div>
        </section>

        <aside class="side">
            <div class="panel panel-term">
                <div class="panel-h"><span class="dot"></span>Terminal<span class="panel-note">real Linux commands</span></div>
                <textarea id="nwConsole" spellcheck="false" autocomplete="off"></textarea>
                <div class="tries" id="tries"></div>
            </div>
            <div class="panel panel-log">
                <div class="panel-h"><span class="dot dot-log"></span>Event log
                    <span class="panel-note" id="logCount"></span>
                    <button class="mini" id="btnClearLog">clear</button>
                </div>
                <div id="eventLog" class="eventlog"></div>
            </div>
        </aside>
    </main>

    <div id="popups"></div>
</body>

</html>
